name: Deploy

on:
  push:
    branches: [master]

permissions: read-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh hosted API
        # The hosted API (universities.hipolabs.com) loads the JSON from
        # master into memory and only reloads it via /update, which is
        # rate-limited to once every 24 hours.
        run: curl -fsS --max-time 60 http://universities.hipolabs.com/update
